<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="url(#baydinCloverGold)" stroke="url(#baydinCloverGoldStroke)" stroke-width="0.35" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Baydin luck clover">
  <title>Baydin luck clover</title>
  <defs>
    <linearGradient id="baydinCloverGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E6C2"/>
      <stop offset="35%" stop-color="#E7D2A8"/>
      <stop offset="65%" stop-color="#C5A87C"/>
