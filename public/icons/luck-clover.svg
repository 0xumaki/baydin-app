      <path d="M 12,12 C 9,11 7,10 7,7 C 7,4 10,4 12,5 C 14,4 17,4 17,7 C 17,10 15,11 12,12 Z" transform="rotate(135 12 12)" fill="url(#baydinCloverSheen)" stroke="none"/>
      <path d="M 12,12 C 9,11 7,10 7,7 C 7,4 10,4 12,5 C 14,4 17,4 17,7 C 17,10 15,11 12,12 Z" transform="rotate(225 12 12)" fill="url(#baydinCloverSheen)" stroke="none"/>
      <path d="M 12,12 C 9,11 7,10 7,7 C 7,4 10,4 12,5 C 14,4 17,4 17,7 C 17,10 15,11 12,12 Z" transform="rotate(315 12 12)" fill="url(#baydinCloverSheen)" stroke="none"/>
    </g>
