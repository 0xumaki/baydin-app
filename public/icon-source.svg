<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="60%" stop-color="#0a0806"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0D9A8"/>
      <stop offset="50%" stop-color="#C5A87C"/>
      <stop offset="100%" stop-color="#8B6F47"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- outer ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
  <!-- 12 zodiac ticks -->
  <g stroke="url(#gold)" stroke-width="2" opacity="0.5">
    <line x1="256" y1="70" x2="256" y2="90"/>
    <line x1="256" y1="422" x2="256" y2="442"/>
    <line x1="70" y1="256" x2="90" y2="256"/>
    <line x1="422" y1="256" x2="442" y2="256"/>
    <line x1="125" y1="125" x2="139" y2="139"/>
    <line x1="373" y1="125" x2="387" y2="139"/>
    <line x1="125" y1="387" x2="139" y2="373"/>
    <line x1="373" y1="387" x2="387" y2="373"/>
  </g>
  <!-- central 8-point star -->
  <g filter="url(#glow)" transform="translate(256, 256)">
    <path d="M 0,-120 L 28,-28 L 120,0 L 28,28 L 0,120 L -28,28 L -120,0 L -28,-28 Z" fill="url(#gold)"/>
    <circle r="48" fill="#0a0806"/>
    <path d="M 0,-32 L 8,-8 L 32,0 L 8,8 L 0,32 L -8,8 L -32,0 L -8,-8 Z" fill="url(#gold)"/>
  </g>
  <!-- brand text -->
  <text x="256" y="475" font-family="Georgia, serif" font-size="28" font-weight="600" text-anchor="middle" fill="url(#gold)" letter-spacing="6">BAYDIN</text>
</svg>
